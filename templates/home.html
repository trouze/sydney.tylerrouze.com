{% extends "base.html" %}

{% block title %}Welcome{% endblock %}

{% block content %}
<section class="h-[calc(100vh-4rem)] flex items-center justify-center text-center px-6">
  <div class="max-w-2xl mx-auto">
    <p class="text-sm md:text-base tracking-[0.3em] uppercase text-stone-600 mb-6">We&apos;re getting married!</p>
    <h1 class="font-display text-[5.5rem] md:text-[7rem] leading-none text-stone-800">
      Sydney<br>
      <span class="text-stone-300 text-6xl md:text-6xl">&amp;</span><br>
      Tyler
    </h1>
    <div class="w-16 h-px bg-stone-300 mx-auto my-6"></div>
    <p class="text-xs tracking-[0.3em] uppercase text-stone-500">
      January 15, 2028
    </p>
    <p class="text-xs tracking-[0.3em] uppercase text-stone-500 mt-2">
      Mexico City, Mexico
    </p>
    <p class="font-display italic text-stone-400 mt-2">Casa de la Bola</p>
    <div class="mt-8 flex gap-4 justify-center flex-wrap">
      <a href="/details" class="px-10 py-3 text-xs tracking-widest uppercase border border-stone-800 text-stone-800 hover:bg-stone-800 hover:text-white transition-colors">
        Details
      </a>
      <a href="/rsvp" class="px-10 py-3 text-xs tracking-widest uppercase bg-stone-800 text-white hover:bg-stone-700 transition-colors">
        RSVP
      </a>
    </div>
  </div>
</section>
{% endblock %}

{% block footer %}{% endblock %}
